name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice
        # The formula-recalculation tests are the guard on this project's
        # highest-impact defect (progress.py read formulas as None and scored
        # 89 of 126 passing trajectories 0.0). They are skipif-gated on
        # soffice/libreoffice, so without an explicit install they depend on
        # whatever the runner image happens to ship -- and would skip silently,
        # leaving CI green with that guarantee unverified.
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc libreoffice-writer

      - name: Verify LibreOffice is present
        # Fail loudly rather than let the recalculation tests skip. Note this
        # checks the binary answers, not that Calc is installed -- a
        # libreoffice-core-only host passes this and still cannot load a
        # spreadsheet, which is exactly what happened in one dev container.
        run: soffice --version || libreoffice --version

      - name: Install pandoc
        # build/md2tex.py shells out to pandoc, and the tests that prove the
        # converter still serves both the full paper and the workshop carve
        # therefore need it. Installed rather than left to skipif for the same
        # reason as LibreOffice above: a silent skip leaves CI green with the
        # guarantee unverified.
        run: sudo apt-get install -y pandoc

      - name: Verify pandoc is present
        run: pandoc --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile $(find harness tests results/analysis -name '*.py')

      - name: Run tests
        run: python -m pytest tests/ -v
